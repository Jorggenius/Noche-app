# Configuración común para todos los perfiles
spring.application.name=nocheApp
server.servlet.context-path=/api
spring.profiles.active=dev
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true

# Configuración para camelCase (coincide con tu BD)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Configuración JPA común
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# Configuración básica de OpenAPI (común a todos los entornos)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=false
springdoc.paths-to-match=/api/**

# Configuración de validación
spring.validation.enabled=true

# Configuración de JWT (común)
#jwt.secret=miClaveSecretaSuperSeguraParaJWT2024NocheApp
#jwt.expiration=86400000

