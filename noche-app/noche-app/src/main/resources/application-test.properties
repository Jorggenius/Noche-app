# Puerto para testing
server.port=8090

# Configuración de base de datos - TESTING
spring.datasource.url=jdbc:mariadb://localhost:3306/nocheapp_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración JPA - TESTING
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop

# Configuración de logging - TESTING
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.transaction=WARN
logging.level.com.schoolDays.noche_app=INFO

# Configuración específica para tests
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always