# Puerto para producción
server.port=8099

# Configuración de base de datos - PRODUCCIÓN
spring.datasource.url=jdbc:mariadb://localhost:3306/nocheapp_prod?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=nocheapp_user
spring.datasource.password=${DB_PASSWORD:tu_password_seguro_aqui}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Pool de conexiones para producción
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Configuración JPA - PRODUCCIÓN
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Configuración de logging - PRODUCCIÓN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.transaction=WARN
logging.level.com.schoolDays.noche_app=INFO
logging.level.org.springframework.web=WARN

# Configuración de seguridad para producción
server.error.include-stacktrace=never
server.error.include-message=never

# Configuración de compresión
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Configuración de caché
spring.resources.cache.cachecontrol.max-age=31536000
spring.resources.chain.strategy.content.enabled=true
spring.resources.chain.strategy.content.paths=/**